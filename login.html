<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · NoneApk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-card">
    <div class="logo-loader"><i class="fas fa-cube"></i></div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to NoneApk</p>
    
    <form>
      <div class="input-group">
        <label><i class="fas fa-envelope"></i> Email</label>
        <input type="email" placeholder="you@example.com" value="" />
      </div>
      
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" placeholder="••••••••" value="" />
      </div>
      
      <div class="remember-me">
        <input type="checkbox" id="remember-me" checked />
        <label for="remember-me">Remember me</label>
      </div>
      
      <button class="btn-primary" type="submit">Log in</button>
    </form>
    
    <div class="footer-links">
      <a href="signup.html"><i class="fas fa-user-plus"></i> Create account</a>
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
  </div>

  <script type="module">
    import './js/config.js';
    import './js/login.js'
  </script>
</body>
</html>
