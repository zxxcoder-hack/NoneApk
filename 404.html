<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · NoneApk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f5f7fb; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .error-box { background: white; border-radius: 40px; padding: 48px 40px; max-width: 480px; width: 100%; border: 1px solid rgba(0,0,0,0.02); }
    .error-box i { font-size: 5rem; color: #6b7280; margin-bottom: 16px; }
    .error-box h1 { font-size: 3rem; font-weight: 700; }
    .error-box p { color: #6b7280; margin: 8px 0 24px; }
    .btn-primary { background: #0a0a0a; color: white; padding: 12px 32px; border-radius: 40px; display: inline-block; font-weight: 600; transition: 0.2s; text-decoration: none; }
    .btn-primary:hover { background: #2d2d2d; transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="error-box">
    <i class="fas fa-exclamation-triangle"></i>
    <h1>404</h1>
    <p>Page not found. The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn-primary"><i class="fas fa-arrow-left"></i> Go home</a>
    <div style="margin-top: 20px; font-size: 0.8rem; color: #9ca3af;">NoneApk · 2026</div>
  </div>
</body>
</html>
